services:
  metabase-db:
    image: postgres:16-alpine
    container_name: deskflow-metabase-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MB_DB_DBNAME}
      POSTGRES_USER: ${MB_DB_USER}
      POSTGRES_PASSWORD: ${MB_DB_PASS}
    volumes:
      - metabase-db-data:/var/lib/postgresql/data
    networks:
      - deskflow-bi

  metabase:
    image: metabase/metabase:latest
    container_name: deskflow-metabase
    restart: unless-stopped
    depends_on:
      - metabase-db
    ports:
      - "${METABASE_PORT}:3000"
    environment:
      MB_DB_TYPE: ${MB_DB_TYPE}
      MB_DB_DBNAME: ${MB_DB_DBNAME}
      MB_DB_PORT: ${MB_DB_PORT}
      MB_DB_USER: ${MB_DB_USER}
      MB_DB_PASS: ${MB_DB_PASS}
      MB_DB_HOST: ${MB_DB_HOST}
    networks:
      - deskflow-bi

volumes:
  metabase-db-data:

networks:
  deskflow-bi:
    driver: bridge


services:
  # ---------------------------------------------------------------------------
  # ML Service (Base FastAPI Service)
  # ---------------------------------------------------------------------------
  ml-service:
    container_name: deskflow-ml-service
    build:
      context: .
      dockerfile: Dockerfile.ml-service
    image: deskflow/ml-service:latest
    restart: unless-stopped
    
    # Environment variables — loaded from .env file or defined below
    environment:
      - SERVICE_NAME=DeskFlow ML Service
      - SERVICE_VERSION=1.0.0
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
    
    # Port mapping: HOST:CONTAINER
    # Using port 8003 (8000 was in use by another service)
    ports:
      - "8003:8000"
    
    # Health check settings
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    
    # Network configuration
    networks:
      - deskflow-backend-network
    
    # Resource limits (optional, adjust based on requirements)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ---------------------------------------------------------------------------
  # Priority Feature Extraction Service
  # ---------------------------------------------------------------------------
  priority-feature-extraction:
    container_name: deskflow-priority-feature-extraction
    build:
      context: .
      dockerfile: Dockerfile.priority-feature-extraction
    image: deskflow/priority-feature-extraction:latest
    restart: unless-stopped
    
    # Environment variables
    environment:
      - APP_NAME=priority_feature_extractor
      - YAKE_TOP=6
      - YAKE_NGRAM_MAX=2
      - SENTIMENT_NEGATIVE_THRESH=-0.1
      - SENTIMENT_POSITIVE_THRESH=0.25
      - CATEGORY_MAPPING_PATH=sample_data/category_mapping.json
      - USE_CATEGORY_MAPPING=False
      - DOMAIN_ACRONYMS_PATH=sample_data/domain_acronyms.json
    
    # Port mapping: HOST:CONTAINER
    # Using port 8002 (8001 was in use by another service)
    ports:
      - "8002:8001"
    
    # Health check settings
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Network configuration
    networks:
      - deskflow-backend-network
    
    # Resource limits (ML service may need more memory for models)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Dependencies (optional - uncomment if this service depends on ml-service)
    # depends_on:
    #   ml-service:
    #     condition: service_healthy

# =============================================================================
# Networks
# =============================================================================
networks:
  deskflow-backend-network:
    name: deskflow-backend-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

# ──────────────────────────────────────────────────────────────────────────────
# Security CI Pipeline
# Triggers: push → feature/DF_83_Quality_gates_in_CI / staging | PR → staging
# Scans ONLY commits introduced by the triggering event (no full-history scans)
# ──────────────────────────────────────────────────────────────────────────────
name: Security CI

on:
  push:
    branches:
      - feature/DF_83_Quality_gates_in_CI
      - staging
  pull_request:
    branches:
      - staging

env:
  COVERAGE_THRESHOLD: "60"
  PYTHON_VERSION: "3.11"
  JAVA_VERSION: "17"
  REPORTS_DIR: security-reports

jobs:
# ══════════════════════════════════════════════════════════════════════════════
# JOB 1 – Detect project type & commit range
# ══════════════════════════════════════════════════════════════════════════════
  detect:
    name: Detect Project and Commit Range
    runs-on: ubuntu-latest
    outputs:
      project_type: ${{ steps.detect.outputs.project_type }}
      commit_range: ${{ steps.range.outputs.commit_range }}
      base_sha:     ${{ steps.range.outputs.base_sha }}
      head_sha:     ${{ steps.range.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          echo "base_sha=$BASE"              >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD"              >> "$GITHUB_OUTPUT"
          echo "commit_range=${BASE}..${HEAD}" >> "$GITHUB_OUTPUT"
          echo "Commit range: ${BASE}..${HEAD}"

      - name: Detect project type
        id: detect
        run: |
          TYPE="unknown"
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || \
             [ -f "Pipfile" ] || [ -f "setup.py" ]; then
            if grep -qiE "fastapi" requirements.txt pyproject.toml Pipfile setup.py 2>/dev/null; then
              TYPE="fastapi"
            else
              TYPE="python-ml"
            fi
          fi
          if [ -f "pom.xml" ] || [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            TYPE="java"
          fi
          if [ "$TYPE" = "unknown" ]; then
            PYFILE=$(find . -maxdepth 3 \( -name "requirements.txt" -o -name "pyproject.toml" \) | head -1)
            if [ -n "$PYFILE" ]; then
              if grep -qiE "fastapi" "$PYFILE" 2>/dev/null; then
                TYPE="fastapi"
              else
                TYPE="python-ml"
              fi
            fi
            JAVAFILE=$(find . -maxdepth 3 \( -name "pom.xml" -o -name "build.gradle" -o -name "build.gradle.kts" \) | head -1)
            if [ -n "$JAVAFILE" ]; then
              TYPE="java"
            fi
          fi
          echo "project_type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "Detected project type: $TYPE"


# ══════════════════════════════════════════════════════════════════════════════
# JOB 2 – Tests & Coverage (Python ML / FastAPI)
# ══════════════════════════════════════════════════════════════════════════════
  test-python:
    name: Tests and Coverage (Python)
    needs: detect
    if: needs.detect.outputs.project_type == 'python-ml' || needs.detect.outputs.project_type == 'fastapi'
    runs-on: ubuntu-latest
    outputs:
      tests_ran:       ${{ steps.run-tests.outputs.tests_ran }}
      coverage_pct:    ${{ steps.run-tests.outputs.coverage_pct }}
      coverage_status: ${{ steps.run-tests.outputs.coverage_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Detect Python project directory
        id: detect-pydir
        run: |
          PYDIR=""
          while IFS= read -r d; do
            if find "$d" -maxdepth 2 -type d -name "tests" | grep -q . || \
               find "$d" -maxdepth 2 -name "test_*.py" | grep -q .; then
              PYDIR="$d"
              break
            fi
          done < <(find . -type f \( -name "requirements.txt" -o -name "pyproject.toml" \) \
                   -exec dirname {} \; | sort -u)
          if [ -z "$PYDIR" ]; then
            PYDIR=$(find . -name "requirements.txt" -exec dirname {} \; | sort | head -1)
          fi
          PYDIR="${PYDIR:-.}"
          echo "pydir=$PYDIR" >> "$GITHUB_OUTPUT"
          echo "Python project directory: $PYDIR"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          find . -name requirements.txt -not -path "./requirements.txt" \
            -exec pip install -r {} \;
          if [ -f pyproject.toml ]; then
            pip install -e . || true
          fi
          PYDIR="${{ steps.detect-pydir.outputs.pydir }}"
          if [ "$PYDIR" != "." ] && [ -f "$PYDIR/pyproject.toml" ]; then
            pip install -e "$PYDIR" || true
          fi
          pip install pytest pytest-cov pip-audit fastapi pydantic-settings httpx

      - name: Detect test presence
        id: detect-tests
        run: |
          PYDIR="${{ steps.detect-pydir.outputs.pydir }}"
          if find "$PYDIR" -type d -name "tests" | grep -q . || \
             find "$PYDIR" -name "test_*.py" | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "Tests found in $PYDIR"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No tests found – skipping."
          fi

      - name: Run pytest with coverage
        id: run-tests
        env:
          REPORTS_DIR: security-reports
          COV_THRESHOLD: "60"
        run: |
          mkdir -p "$REPORTS_DIR"
          ABS_REPORTS="$(pwd)/$REPORTS_DIR"
          PYDIR="${{ steps.detect-pydir.outputs.pydir }}"
          HAS_TESTS="${{ steps.detect-tests.outputs.has_tests }}"

          if [ "$HAS_TESTS" = "true" ]; then
            set +e
            (cd "$PYDIR" && python -m pytest \
              --cov=. \
              --cov-report=xml:"$ABS_REPORTS/coverage.xml" \
              --cov-report=term-missing \
              --cov-fail-under="$COV_THRESHOLD" \
              -q 2>&1 | tee "$ABS_REPORTS/pytest-output.txt")
            EXIT_CODE=$?
            set -e

            cat > /tmp/parse_cov.py << 'SCRIPT'
import xml.etree.ElementTree as ET
import sys
import os
try:
    root = ET.parse(sys.argv[1]).getroot()
    pct = round(float(root.attrib.get("line-rate", "0")) * 100, 2)
    print(pct)
except Exception:
    print("0")
SCRIPT
            PCT=$(python3 /tmp/parse_cov.py "$ABS_REPORTS/coverage.xml")
            echo "coverage_pct=$PCT"      >> "$GITHUB_OUTPUT"
            echo "tests_ran=true"         >> "$GITHUB_OUTPUT"
            if [ "$EXIT_CODE" -eq 0 ]; then
              echo "coverage_status=PASS" >> "$GITHUB_OUTPUT"
            else
              echo "coverage_status=FAIL" >> "$GITHUB_OUTPUT"
              exit "$EXIT_CODE"
            fi
          else
            echo "tests_ran=false"          >> "$GITHUB_OUTPUT"
            echo "coverage_pct=N/A"         >> "$GITHUB_OUTPUT"
            echo "coverage_status=SKIPPED"  >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage report
        if: steps.detect-tests.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: security-reports/coverage.xml


# ══════════════════════════════════════════════════════════════════════════════
# JOB 3 – Tests & Coverage (Java)
# ══════════════════════════════════════════════════════════════════════════════
  test-java:
    name: Tests and Coverage (Java)
    needs: detect
    if: needs.detect.outputs.project_type == 'java'
    runs-on: ubuntu-latest
    outputs:
      tests_ran:       ${{ steps.results.outputs.tests_ran }}
      coverage_pct:    ${{ steps.results.outputs.coverage_pct }}
      coverage_status: ${{ steps.results.outputs.coverage_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Detect build tool and tests
        id: detect-java
        run: |
          if [ -f "pom.xml" ]; then
            echo "build_tool=maven" >> "$GITHUB_OUTPUT"
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "build_tool=gradle" >> "$GITHUB_OUTPUT"
          else
            echo "build_tool=none" >> "$GITHUB_OUTPUT"
          fi
          if find . -path "*/src/test/java/*.java" | grep -q . || \
             find . \( -name "*Test.java" -o -name "*Tests.java" \) | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Maven tests with JaCoCo
        id: maven-tests
        if: steps.detect-java.outputs.has_tests == 'true' && steps.detect-java.outputs.build_tool == 'maven'
        env:
          REPORTS_DIR: security-reports
          COV_THRESHOLD: "60"
        run: |
          mkdir -p "$REPORTS_DIR"
          set +e
          mvn -B verify jacoco:report 2>&1 | tee "$REPORTS_DIR/maven-output.txt"
          EXIT_CODE=$?
          set -e
          JACOCO=$(find . -name "jacoco.xml" | head -1)
          if [ -n "$JACOCO" ]; then
            cp "$JACOCO" "$REPORTS_DIR/jacoco.xml"
            cat > /tmp/parse_jacoco.py << 'SCRIPT'
import xml.etree.ElementTree as ET
import sys
try:
    root = ET.parse(sys.argv[1]).getroot()
    node = root.find('.//counter[@type="LINE"]')
    missed  = int(node.get("missed", 0))
    covered = int(node.get("covered", 0))
    total   = missed + covered
    print(round(covered / total * 100, 2) if total else 0)
except Exception:
    print("0")
SCRIPT
            PCT=$(python3 /tmp/parse_jacoco.py "$REPORTS_DIR/jacoco.xml")
            echo "coverage_pct=$PCT"   >> "$GITHUB_OUTPUT"
            if awk "BEGIN{exit !($PCT < $COV_THRESHOLD)}"; then
              echo "coverage_status=FAIL" >> "$GITHUB_OUTPUT"
              exit 1
            else
              echo "coverage_status=PASS" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "coverage_pct=N/A"        >> "$GITHUB_OUTPUT"
            echo "coverage_status=UNKNOWN" >> "$GITHUB_OUTPUT"
          fi
          echo "tests_ran=true" >> "$GITHUB_OUTPUT"
          exit "$EXIT_CODE"

      - name: Run Gradle tests with JaCoCo
        id: gradle-tests
        if: steps.detect-java.outputs.has_tests == 'true' && steps.detect-java.outputs.build_tool == 'gradle'
        env:
          REPORTS_DIR: security-reports
        run: |
          mkdir -p "$REPORTS_DIR"
          set +e
          ./gradlew test jacocoTestReport 2>&1 | tee "$REPORTS_DIR/gradle-output.txt"
          EXIT_CODE=$?
          set -e
          JACOCO=$(find . -name "jacocoTestReport.xml" | head -1)
          if [ -n "$JACOCO" ]; then
            cp "$JACOCO" "$REPORTS_DIR/jacoco.xml"
          fi
          echo "tests_ran=true"       >> "$GITHUB_OUTPUT"
          echo "coverage_pct=N/A"     >> "$GITHUB_OUTPUT"
          echo "coverage_status=PASS" >> "$GITHUB_OUTPUT"
          exit "$EXIT_CODE"

      - name: No tests found
        id: no-tests
        if: steps.detect-java.outputs.has_tests == 'false'
        run: |
          echo "No Java tests found – skipping."

      - name: Consolidate test results
        id: results
        run: |
          if [ "${{ steps.detect-java.outputs.has_tests }}" = "false" ]; then
            echo "tests_ran=false"          >> "$GITHUB_OUTPUT"
            echo "coverage_pct=N/A"         >> "$GITHUB_OUTPUT"
            echo "coverage_status=SKIPPED"  >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.detect-java.outputs.build_tool }}" = "maven" ]; then
            echo "tests_ran=${{ steps.maven-tests.outputs.tests_ran }}"             >> "$GITHUB_OUTPUT"
            echo "coverage_pct=${{ steps.maven-tests.outputs.coverage_pct }}"       >> "$GITHUB_OUTPUT"
            echo "coverage_status=${{ steps.maven-tests.outputs.coverage_status }}" >> "$GITHUB_OUTPUT"
          else
            echo "tests_ran=${{ steps.gradle-tests.outputs.tests_ran }}"             >> "$GITHUB_OUTPUT"
            echo "coverage_pct=${{ steps.gradle-tests.outputs.coverage_pct }}"       >> "$GITHUB_OUTPUT"
            echo "coverage_status=${{ steps.gradle-tests.outputs.coverage_status }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload JaCoCo report
        if: steps.detect-java.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: security-reports/jacoco.xml
          if-no-files-found: ignore


# ══════════════════════════════════════════════════════════════════════════════
# JOB 4 – Dependency Audit
# ══════════════════════════════════════════════════════════════════════════════
  dependency-audit:
    name: Dependency Audit
    needs: detect
    runs-on: ubuntu-latest
    outputs:
      tool:          ${{ steps.audit.outputs.tool }}
      total_vulns:   ${{ steps.audit.outputs.total_vulns }}
      critical_high: ${{ steps.audit.outputs.critical_high }}
      audit_status:  ${{ steps.audit.outputs.audit_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python (audit)
        if: needs.detect.outputs.project_type == 'python-ml' || needs.detect.outputs.project_type == 'fastapi'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pip-audit
        id: pip-audit
        if: needs.detect.outputs.project_type == 'python-ml' || needs.detect.outputs.project_type == 'fastapi'
        env:
          REPORTS_DIR: security-reports
        run: |
          mkdir -p "$REPORTS_DIR"
          pip install pip-audit
          REQ_FLAG=""
          if [ -f requirements.txt ]; then
            REQ_FLAG="-r requirements.txt"
          fi
          set +e
          pip-audit $REQ_FLAG --format json --output "$REPORTS_DIR/dependency-audit.json" 2>&1
          set -e
          cat > /tmp/parse_pip_audit.py << 'SCRIPT'
import json, sys, os
try:
    data      = json.load(open(sys.argv[1]))
    vulns     = data.get("vulnerabilities", [])
    total     = len(vulns)
    crit_high = sum(
        1 for v in vulns
        if any(a.upper().startswith(("GHSA", "CVE")) for a in v.get("aliases", []))
    )
    out = os.environ["GITHUB_OUTPUT"]
    with open(out, "a") as f:
        f.write(f"total_vulns={total}\n")
        f.write(f"critical_high={crit_high}\n")
        f.write("tool=pip-audit\n")
        f.write("audit_status=" + ("FAIL" if crit_high > 0 else "PASS") + "\n")
except Exception as exc:
    print(f"Parse error: {exc}")
    out = os.environ["GITHUB_OUTPUT"]
    with open(out, "a") as f:
        f.write("total_vulns=0\ncritical_high=0\ntool=pip-audit\naudit_status=PASS\n")
SCRIPT
          python3 /tmp/parse_pip_audit.py "$REPORTS_DIR/dependency-audit.json"

      - name: Install Trivy
        if: needs.detect.outputs.project_type == 'java'
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy

      - name: Run Trivy filesystem scan
        id: trivy-scan
        if: needs.detect.outputs.project_type == 'java'
        env:
          REPORTS_DIR: security-reports
        run: |
          mkdir -p "$REPORTS_DIR"
          set +e
          trivy fs . \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --format json \
            --output "$REPORTS_DIR/dependency-audit.json"
          set -e
          cat > /tmp/parse_trivy.py << 'SCRIPT'
import json, sys, os
try:
    data    = json.load(open(sys.argv[1]))
    results = data.get("Results", [])
    total   = sum(len(r.get("Vulnerabilities") or []) for r in results)
    ch      = sum(
        1 for r in results
        for v in (r.get("Vulnerabilities") or [])
        if v.get("Severity", "").upper() in ("HIGH", "CRITICAL")
    )
    out = os.environ["GITHUB_OUTPUT"]
    with open(out, "a") as f:
        f.write(f"total_vulns={total}\n")
        f.write(f"critical_high={ch}\n")
        f.write("tool=Trivy\n")
        f.write("audit_status=" + ("FAIL" if ch > 0 else "PASS") + "\n")
except Exception as exc:
    print(f"Parse error: {exc}")
    out = os.environ["GITHUB_OUTPUT"]
    with open(out, "a") as f:
        f.write("total_vulns=0\ncritical_high=0\ntool=Trivy\naudit_status=PASS\n")
SCRIPT
          python3 /tmp/parse_trivy.py "$REPORTS_DIR/dependency-audit.json"

      - name: Consolidate audit outputs
        id: audit
        run: |
          TOOL="${{ steps.pip-audit.outputs.tool }}"
          if [ -z "$TOOL" ]; then
            TOOL="${{ steps.trivy-scan.outputs.tool }}"
            echo "tool=${{ steps.trivy-scan.outputs.tool }}"               >> "$GITHUB_OUTPUT"
            echo "total_vulns=${{ steps.trivy-scan.outputs.total_vulns }}" >> "$GITHUB_OUTPUT"
            echo "critical_high=${{ steps.trivy-scan.outputs.critical_high }}" >> "$GITHUB_OUTPUT"
            echo "audit_status=${{ steps.trivy-scan.outputs.audit_status }}" >> "$GITHUB_OUTPUT"
          else
            echo "tool=${{ steps.pip-audit.outputs.tool }}"               >> "$GITHUB_OUTPUT"
            echo "total_vulns=${{ steps.pip-audit.outputs.total_vulns }}" >> "$GITHUB_OUTPUT"
            echo "critical_high=${{ steps.pip-audit.outputs.critical_high }}" >> "$GITHUB_OUTPUT"
            echo "audit_status=${{ steps.pip-audit.outputs.audit_status }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail on high or critical vulnerabilities
        if: steps.audit.outputs.audit_status == 'FAIL'
        run: |
          echo "High/Critical vulnerabilities found – failing pipeline."
          exit 1

      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: security-reports/dependency-audit.json
          if-no-files-found: ignore


# ══════════════════════════════════════════════════════════════════════════════
# JOB 5 – SAST (Semgrep)
# ══════════════════════════════════════════════════════════════════════════════
  sast:
    name: SAST Semgrep
    needs: detect
    runs-on: ubuntu-latest
    outputs:
      semgrep_findings: ${{ steps.semgrep.outputs.semgrep_findings }}
      sast_status:      ${{ steps.semgrep.outputs.sast_status }}
      severity_summary: ${{ steps.semgrep.outputs.severity_summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: pip install semgrep

      - name: Resolve changed files in commit range
        id: changed-files
        run: |
          BASE="${{ needs.detect.outputs.base_sha }}"
          HEAD="${{ needs.detect.outputs.head_sha }}"
          git fetch origin "$BASE" 2>/dev/null || true
          FILES=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null \
                  | grep -E '\.(py|java|js|ts|go|rb|php|sh)$' \
                  | tr '\n' ' ')
          echo "changed_files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed files: $FILES"

      - name: Run Semgrep
        id: semgrep
        env:
          REPORTS_DIR: security-reports
        run: |
          mkdir -p "$REPORTS_DIR"
          FILES="${{ steps.changed-files.outputs.changed_files }}"
          if [ -z "$FILES" ]; then
            SCAN_TARGET="."
          else
            SCAN_TARGET="$FILES"
          fi
          set +e
          semgrep --config=auto \
            --json \
            --output "$REPORTS_DIR/semgrep-report.json" \
            $SCAN_TARGET 2>&1
          set -e
          cat > /tmp/parse_semgrep.py << 'SCRIPT'
import json, sys, os
try:
    data    = json.load(open(sys.argv[1]))
    results = data.get("results", [])
    total   = len(results)
    sev_map = {}
    for r in results:
        sev = r.get("extra", {}).get("severity", "UNKNOWN").upper()
        sev_map[sev] = sev_map.get(sev, 0) + 1
    summary = ", ".join(f"{k}:{v}" for k, v in sev_map.items()) or "none"
    status  = "FAIL" if sev_map.get("ERROR", 0) > 0 else "PASS"
    out = os.environ["GITHUB_OUTPUT"]
    with open(out, "a") as f:
        f.write(f"semgrep_findings={total}\n")
        f.write(f"severity_summary={summary}\n")
        f.write(f"sast_status={status}\n")
except Exception as exc:
    print(f"Parse error: {exc}")
    out = os.environ["GITHUB_OUTPUT"]
    with open(out, "a") as f:
        f.write("semgrep_findings=0\nseverity_summary=none\nsast_status=PASS\n")
SCRIPT
          python3 /tmp/parse_semgrep.py "$REPORTS_DIR/semgrep-report.json"

      - name: Fail on high or critical SAST findings
        if: steps.semgrep.outputs.sast_status == 'FAIL'
        run: |
          echo "High/Critical Semgrep findings – failing pipeline."
          exit 1

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: security-reports/semgrep-report.json


# ══════════════════════════════════════════════════════════════════════════════
# JOB 6 – Secret Detection (Gitleaks)
# ══════════════════════════════════════════════════════════════════════════════
  secret-scan:
    name: Secret Detection Gitleaks
    needs: detect
    runs-on: ubuntu-latest
    outputs:
      secrets_found: ${{ steps.gitleaks.outputs.secrets_found }}
      secret_status: ${{ steps.gitleaks.outputs.secret_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.18.4"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks on commit range
        id: gitleaks
        env:
          REPORTS_DIR: security-reports
        run: |
          mkdir -p "$REPORTS_DIR"
          BASE="${{ needs.detect.outputs.base_sha }}"
          HEAD="${{ needs.detect.outputs.head_sha }}"
          git fetch origin "$BASE" 2>/dev/null || true
          set +e
          gitleaks detect \
            --source . \
            --log-opts "${BASE}..${HEAD}" \
            --report-format json \
            --report-path "$REPORTS_DIR/gitleaks-report.json" \
            --exit-code 1 \
            --no-banner 2>&1
          EXIT_CODE=$?
          set -e
          cat > /tmp/parse_gitleaks.py << 'SCRIPT'
import json, sys, os
try:
    data   = json.load(open(sys.argv[1]))
    total  = len(data) if isinstance(data, list) else 0
    status = "FAIL" if total > 0 else "PASS"
    out    = os.environ["GITHUB_OUTPUT"]
    with open(out, "a") as f:
        f.write(f"secrets_found={total}\n")
        f.write(f"secret_status={status}\n")
except Exception:
    out = os.environ["GITHUB_OUTPUT"]
    with open(out, "a") as f:
        f.write("secrets_found=0\nsecret_status=PASS\n")

name: Model Evaluation Harness

on:
  push:
    paths:
      - 'ml/eval_harness/**'
      - '.github/workflows/eval-harness.yml'
  pull_request:
    paths:
      - 'ml/eval_harness/**'
      - '.github/workflows/eval-harness.yml'

jobs:
  eval-harness:
    name: Run Evaluation Harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/eval_harness/requirements.txt

      - name: Run Test Suite
        working-directory: ml/eval_harness
        run: pytest tests/ -v

      - name: Run Evaluation Harness
        working-directory: ml/eval_harness
        run: python eval.py

      - name: Upload Evaluation Report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: ml/eval_harness/reports/latest.json
